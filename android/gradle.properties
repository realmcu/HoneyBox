org.gradle.jvmargs=-Xmx2560M -XX:MaxMetaspaceSize=768M -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536M
android.useAndroidX=true
# AndroidX 过渡期已过,所有依赖原生 AndroidX,禁用 Jetifier 以避免
# Kotlin 2.1.x + JetifyTransform 在 Flutter 3.44.x 上的兼容崩溃
# (x86_64_debug.jar 已属 AndroidX,再转导致 transform 失败)
android.enableJetifier=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Keep Flutter engine and plugin native libraries aligned with the app's ARM64 ABI filter.
target-platform=android-arm64
# Kotlin 增量编译在「插件源码位于 C 盘 pub-cache、工程位于 D 盘」时会抛
# "this and base files have different roots" 异常(跨盘符无法算相对路径)。
# 本项目 Kotlin 仅插件胶水代码,关掉增量编译可彻底规避该报错,对构建速度几乎无影响。
kotlin.incremental=false
