name: honeybox
description: HoneyBox device debugging and content management application.
publish_to: 'none'
version: 0.8.23+17

environment:
  sdk: '>=3.6.0 <4.0.0'

workspace:
  - packages/watch_frame_channel
  - packages/watch_transport
  - packages/watch_transport_ble
  - packages/watch_transport_ble/example
  - packages/watch_transport_simulation
  - packages/ws_watch_sdk
  - packages/ws_watch_demo
  - packages/ws_watch_demo/example

dependencies:
  watch_frame_channel:
    path: packages/watch_frame_channel
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_blue_plus: ^2.3.10
  # Direct dependency so the app can read the negotiated ATT MTU on platforms
  # where BluetoothDevice.requestMtu is Android-only (see ble_mtu.dart).
  flutter_blue_plus_platform_interface: ^9.0.3
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  package_info_plus: ^8.1.1
  open_filex: ^4.5.0
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.4
  pointycastle: ^3.9.1
  palette_generator: ^0.3.3+7
  watch_transport_ble:
    path: packages/watch_transport_ble
  ws_watch_demo:
    path: packages/ws_watch_demo
  archive: ^4.5.2
  share_plus: ^12.0.2

dev_dependencies:
  watch_transport:
    path: packages/watch_transport
  flutter_test:
    sdk: flutter

  # NOTE: build_runner / riverpod_generator / json_annotation / custom_lint /
  # riverpod_lint were removed — they were unused scaffolding (no @riverpod,
  # no .g.dart, no @JsonSerializable anywhere in lib/) and their pinned
  # versions depend on the macros experiment, which was removed from the
  # Dart SDK, breaking `pub get`. Re-add macros-free versions if codegen or
  # custom lint rules are needed later.
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/example/img/
    - assets/example/gif/
    - assets/example/video/
