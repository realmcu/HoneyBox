name: ebadge_app
description: eBadge Flutter application for electronic badge debugging and content management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_blue_plus: ^1.32.6
  image_picker: ^1.1.2
  file_picker: ^8.1.3
  camera: ^0.11.0
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  json_annotation: ^4.9.0
  custom_lint: ^0.6.8
  riverpod_lint: ^2.3.13
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
