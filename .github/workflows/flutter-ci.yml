name: HoneyBox CI

on:
  push:
    branches: [master, main, develop]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'assets/**'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Analyze & Test ───────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ─── Job 2: Build Android APK ────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [analyze]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --debug

      - name: Build Android APK (release)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeybox-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  # ─── Job 3: Windows Build ────────────────────────────────────────
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: [analyze]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: honeybox-windows-release
          path: build/windows/x64/runner/Release/
          retention-days: 7

  # ─── Job 4: Code Format Check ────────────────────────────────────
  lint:
    name: Dart Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/ test/

      - name: Check release policy
        shell: pwsh
        run: ./test/ci/flutter_ci_workflow_test.ps1

  # ─── Job 5: Publish Release ───────────────────────────────────────
  release:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-android, build-windows, lint]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: honeybox-android-apk
          path: release-artifacts/

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: honeybox-windows-release
          path: release-artifacts/windows/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "HoneyBox ${{ github.ref_name }}"
          body: |
            ## HoneyBox ${{ github.ref_name }}

            Built from commit ${{ github.sha }}

            ### Downloads
            - **Android release APK** - `honeybox-android-apk`
            - **Windows x64** - `honeybox-windows-release`
          files: |
            release-artifacts/**
          prerelease: false
          generate_release_notes: true
