name: jw_watch_sdk
description: Public Flutter SDK contract for JW watch devices.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  watch_frame_channel:
    path: ../watch_frame_channel
  watch_transport:
    path: ../watch_transport
  watch_transport_ble:
    path: ../watch_transport_ble
  path_provider: ^2.1.4

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
