name: ws_watch_demo
description: Minimal WS Watch SDK demo (simulator-first).
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  ws_watch_sdk:
    path: ../ws_watch_sdk
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/settings/
    - assets/health/
    - assets/data_home/
