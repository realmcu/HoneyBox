name: jw_watch_demo
description: Public JW SDK Demo feature for HoneyBox and standalone examples.
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  jw_watch_sdk:
    path: ../jw_watch_sdk
  path_provider: ^2.1.4
  permission_handler: ^11.3.1

dev_dependencies:
  drift: ^2.35.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/settings/
    - assets/health/
    - assets/data_home/
