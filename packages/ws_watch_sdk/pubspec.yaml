name: ws_watch_sdk
description: Public Flutter SDK for WS watches (binary L2 wire protocol).
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  meta: ^1.16.0
  drift: '>=2.34.0 <2.35.0'
  drift_flutter: ^0.3.1
  path_provider: ^2.1.4
  watch_frame_channel:
    path: ../watch_frame_channel
  watch_transport:
    path: ../watch_transport
  watch_transport_ble:
    path: ../watch_transport_ble
  watch_transport_simulation:
    path: ../watch_transport_simulation

dev_dependencies:
  # Keep macOS 13 / Dart 3.10 resolvable; build_runner 2.15+ requires Dart 3.11,
  # whose macOS x64 runtime requires macOS 14.
  build_runner: '>=2.4.15 <2.15.0'
  # 2.35+ requires analyzer 13, which conflicts with Flutter 3.38's pinned
  # meta 1.17 on the newest Flutter version supported by macOS 13.
  drift_dev: '>=2.34.0 <2.35.0'
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
